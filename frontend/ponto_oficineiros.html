<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../style/ponto_oficineiros.css">

<title>Ponto dos Oficineiros</title>

</head>

<body>

<h1>Ponto dos Oficineiros</h1>

<div class="container">

<form id="oficineiros">

<div>
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>
</div>
 
<div>
<label for="matricula">Matricula:</label>
<input type="text" id="matricula" name="matricula" required>
</div>

<div>
<label for="atividade">Atividade:</label>
<input type="text" id="atividade" name="atividade" required>
</div>

<div>
<label for="data">Data:</label>
<input type="date" id="data" name="data" required>
</div>

<div>
<label for="entrada">Hora de Entrada:</label>
<input type="time" id="entrada" name="entrada" required>
</div>

<div>
<label for="intervalo">Hora de Intervalo:</label>
<input type="time" id="intervalo" name="intervalo" required>
</div>

<div>
<label for="retorno">Hora de Retorno:</label>
<input type="time" id="retorno" name="retorno" required>
</div>

<div>
<label for="situacao">Situação:</label>

<select id="situacao" name="situacao" required>
<option value="ativo">Ativo</option>
<option value="inativo">Inativo</option>
</select>

</div>

<div>
<label for="saida">Hora de Saída:</label>
<input type="time" id="saida" name="saida" required>
</div>

<div class="full">
<label for="observacao">Observação:</label>
<textarea id="observacao" name="observacao"></textarea>
</div>

<div class="full">
<label for="arquivo">Carregar planilha (EXCEL):</label>
<input type="file" id="arquivo" name="arquivo" accept=".xlsx, .xls">
</div>

<button type="submit">
Registrar Ponto
</button>

<button type="button" id="voltar" onclick="window.location.href='../frontend/menu.html'">
Voltar
</button>

</form>

</div>

</body>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="../backend/cadastro_oficineiros.js"></script>
<script src="../backend/leitor_csv.js"></script>
</html>
