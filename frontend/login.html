<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ponto</title>
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Login</h1>
            <form id="login" class="login-form">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Insira o nome de usuário">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Insira a senha" required>

                <button type="submit">Entrar</button>
                <a href="../frontend/cadastro_usuarios.html">Cadastrar Usuario</a>
            </form>
        </div>
    </div>
</body>
<script src="../backend/login.js"></script>
</html>
