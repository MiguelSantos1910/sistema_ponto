<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Ponto</title>
    <link rel="stylesheet" href="../style/cadastro_usuarios.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Cadastro de Usuário</h1>

            <form id="cadastro" class="cadastro-form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Insira o nome de usuário">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Insira a senha" required>

                <button type="submit">Cadastrar Usuário</button>
            </form>
        </div>
    </div>

</body>
</html>
