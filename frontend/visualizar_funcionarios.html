<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualização do Ponto</title>
    <link rel="stylesheet" href="../style/visualizar_funcionarios.css" />
</head>
<body>
    <h1>Visualização do Ponto</h1>

    <div class="container">
        <div class="card">
            <div class="topo">
                <div class="total-registros">
                    Total de Registros:
                    <span id="total-registros">0</span>
                </div>

                <button
                    class="btn-voltar"
                    type="button"
                    onclick="window.location.href='../frontend/menu.html'"
                >
                    ← Voltar ao Menu
                </button>
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Crédito/Débito</th>
                            <th>Total de Horas</th>
                            <th>Transformação das Horas em Dias</th>
                            <th>Previsão de Compensação</th>
                            <th>Observação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-funcionarios">
                        <!-- Dados carregados via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de edição -->
    <div id="modal-edicao" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Registro</h2>

            <form id="form-edicao">
                <input type="hidden" id="indice-edicao" />

                <label for="edit-nome">Nome</label>
                <input
                    type="text"
                    id="edit-nome"
                    required
                />

                <label for="edit-credito">Crédito/Débito</label>
                <input
                    type="text"
                    id="edit-credito"
                    required
                />

                <label for="edit-total-horas">Total de Horas</label>
                <input
                    type="text"
                    id="edit-total-horas"
                    required
                />

                <label for="edit-dias">
                    Transformação em Dias
                </label>
                <input
                    type="text"
                    id="edit-dias"
                    required
                />

                <label for="edit-previsao">
                    Previsão de Compensação
                </label>
                <input
                    type="text"
                    id="edit-previsao"
                    required
                />

                <label for="edit-observacao">Observação</label>
                <textarea
                    id="edit-observacao"
                    rows="4"
                ></textarea>

                <div class="modal-botoes">
                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        Salvar
                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModal()"
                    >
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../backend/visualizar_funcionarios.js"></script>
</body>
</html>
